<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classcribe · promo video</title>
<meta name="description" content="Record your lecture. Get your notes. The Classcribe promo video.">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono&display=swap" rel="stylesheet">
<style>
  :root { --bg: #050505; --ink: #f3f3f1; --dim: #8b8b88; --line: rgba(255,255,255,.12); }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
         min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 48px 16px 40px; }
  header { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  header img { width: min(320px, 70vw); height: auto; }
  header p { color: var(--dim); font-size: 16px; letter-spacing: -.01em; }
  .player { width: min(1100px, 100%); margin-top: 36px; border-radius: 22px; overflow: hidden; border: 1px solid var(--line);
            box-shadow: 0 40px 120px rgba(0,0,0,.6), 0 0 120px rgba(255,255,255,.04); background: #000; aspect-ratio: 16 / 9; }
  video { width: 100%; height: 100%; display: block; background: #000; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 30px; }
  a.btn { display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 24px; border-radius: 26px; text-decoration: none;
          font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
  a.primary { background: var(--ink); color: #0b0b0b; }
  a.ghost { color: var(--ink); border: 1px solid var(--line); }
  a.btn:hover { opacity: .85; }
  footer { margin-top: auto; padding-top: 48px; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: .08em;
           text-transform: uppercase; color: var(--dim); text-align: center; }
</style>
</head>
<body>
  <header>
    <img src="logo-dark.png" alt="Classcribe">
    <p>Record your lecture. Get your notes.</p>
  </header>

  <div class="player">
    <!-- the video lives in the latest GitHub release, not in the repo -->
    <video controls playsinline preload="metadata" poster="poster.jpg"
           src="https://github.com/iago-df/classcribe/releases/latest/download/Classcribe-promo.mp4">
      Your browser can not play this video.
    </video>
  </div>

  <div class="actions">
    <a class="btn primary" href="https://github.com/iago-df/classcribe/releases/latest/download/Classcribe.apk">⬇ Download for Android</a>
    <a class="btn ghost" href="https://github.com/iago-df/classcribe">View on GitHub</a>
  </div>

  <footer>45 s · with sound · sample data</footer>
</body>
</html>
